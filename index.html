<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电池信息</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #e5e5ea;
    --accent: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --line: #38383a;
      --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { padding: 8px 4px 16px; }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    line-height: 1.2;
    font-weight: 700;
  }
  .sub {
    margin: 0;
    font-size: 15px;
    color: var(--muted);
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
  }
  .row {
    display: grid;
    grid-template-columns: minmax(7.5em, 42%) 1fr;
    gap: 12px;
    align-items: baseline;
    padding: 15px 18px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .label {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.4;
  }
  .value {
    font-size: 17px;
    line-height: 1.4;
    text-align: right;
    word-break: break-word;
    font-variant-numeric: tabular-nums;
  }
  .value .unit {
    color: var(--muted);
    font-size: 15px;
  }
  .value.missing {
    color: var(--muted);
    font-weight: 400;
  }
  .foot {
    margin: 18px 4px 0;
    font-size: 13px;
    line-height: 1.5;
    color: var(--muted);
  }
  @media (max-width: 360px) {
    .row { grid-template-columns: 1fr; gap: 2px; }
    .value { text-align: left; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>电池信息</h1>
    <p class="sub">NFC 碰一碰查看</p>
  </header>

  <section class="card" aria-label="电池参数列表">
    <div id="list"></div>
  </section>

  <p class="foot" id="foot"></p>
</main>

<script>
(function () {
  // 固定展示顺序；key 大小写不敏感匹配
  var FIELDS = [
    { key: 'HS', label: '电池健康状况', unit: '' },
    { key: 'BV', label: '总电池电压', unit: 'V' },
    { key: 'BC', label: '电池电流', unit: 'A' },
    { key: 'TS', label: '电池温度', unit: '度' },
    { key: 'BP', label: '端口功率', unit: 'W' },
    { key: 'BN', label: '电池循环次数', unit: '次' },
    { key: 'MC', label: '使用最大容量', unit: 'mAh' },
    { key: 'CC', label: '当前容量', unit: 'mAh' },
    { key: 'LP', label: '电池寿命', unit: '%' },
    { key: 'MN', label: '产品型号', unit: '' },
    { key: 'BB', label: '产品品牌', unit: '' },
    { key: 'BM', label: '电池厂商', unit: '' },
    { key: 'PM', label: '生产厂商', unit: '' },
    { key: 'PD', label: '生产时间', unit: '' },
    { key: 'SN', label: '产品序列号', unit: '' }
  ];

  var params = new URLSearchParams(window.location.search);
  var paramMap = new Map();

  // 建立大小写不敏感的参数映射，忽略重复键中的后出现值覆盖前值
  params.forEach(function (value, key) {
    paramMap.set(String(key).toUpperCase(), value);
  });

  var list = document.getElementById('list');
  var found = 0;

  FIELDS.forEach(function (field) {
    var raw = paramMap.get(field.key);
    var value = raw == null ? '' : String(raw).trim();

    var row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('data-key', field.key);

    var labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.textContent = field.label;

    var valueEl = document.createElement('div');
    valueEl.className = 'value';

    if (value === '') {
      valueEl.classList.add('missing');
      valueEl.textContent = '—';
    } else {
      found++;
      valueEl.textContent = value;

      if (field.unit) {
        var unitEl = document.createElement('span');
        unitEl.className = 'unit';
        // “%”紧贴数值，其余单位前加一个空格
        unitEl.textContent = field.unit === '%' ? '%' : ' ' + field.unit;
        valueEl.appendChild(unitEl);
      }
    }

    row.appendChild(labelEl);
    row.appendChild(valueEl);
    list.appendChild(row);
  });

  document.getElementById('foot').textContent =
    found > 0
      ? '共解析到 ' + found + ' 项参数。'
      : '未在 URL 中检测到上述参数。';
})();
</script>
</body>
</html>
